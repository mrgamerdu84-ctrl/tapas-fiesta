name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Vérifier le jeu
        id: game
        shell: bash
        run: |
          if [ -f www/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "www/index.html trouvé : le build Android va démarrer."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "www/index.html n'est pas encore présent dans le dépôt."
            echo "Ajoute le fichier du ZIP dans www/index.html puis le prochain push construira automatiquement l'APK."
          fi

      - name: Vérifier l'icône et le splash
        id: branding
        if: steps.game.outputs.present == 'true'
        shell: bash
        run: |
          if [ -f resources/icon.png ] && [ -f resources/splash.png ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Branding Tapas Fiesta trouvé."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Branding absent : le build utilisera les ressources Android par défaut."
          fi

      - name: Installer Node.js
        if: steps.game.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le JDK 17
        if: steps.game.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dependances npm
        if: steps.game.outputs.present == 'true'
        run: npm install

      - name: Ajouter la plateforme Android
        if: steps.game.outputs.present == 'true'
        run: npx cap add android

      - name: Préparer le branding Android sans modifier les originaux
        if: steps.game.outputs.present == 'true' && steps.branding.outputs.present == 'true'
        shell: bash
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          rm -rf .branding-build
          mkdir -p .branding-build

          # L'icône source reste intacte. On ne génère ici que les tailles techniques Android.
          convert resources/icon.png -resize 1024x1024! .branding-build/icon-only.png

          # Le splash original vertical reste intact. Une copie de build est simplement placée
          # sur un fond crème afin de respecter le format carré demandé par les outils Android.
          convert resources/splash.png \
            -resize 2732x2732 \
            -background '#F6EEDD' \
            -gravity center \
            -extent 2732x2732 \
            .branding-build/splash.png

          npm install --no-save @capacitor/assets
          npx @capacitor/assets generate --android --assetPath .branding-build

      - name: Synchroniser le contenu web vers Android
        if: steps.game.outputs.present == 'true'
        run: npx cap sync android

      - name: Autoriser l'execution de gradlew
        if: steps.game.outputs.present == 'true'
        run: chmod +x android/gradlew

      - name: Construire l'APK debug
        if: steps.game.outputs.present == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK en artefact telechargeable
        if: steps.game.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tapas-fiesta-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
