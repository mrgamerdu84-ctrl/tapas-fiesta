name: Build Tapas Fiesta APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare game
        shell: bash
        run: |
          set -e
          if [ -s www/index.html ]; then
            echo "Game source found"
          elif [ -f Tapas_Fiesta_Capacitor.zip ]; then
            mkdir -p .zip-source www
            unzip -q Tapas_Fiesta_Capacitor.zip -d .zip-source
            if [ -f .zip-source/tapas-capacitor/www/index.html ]; then
              cp .zip-source/tapas-capacitor/www/index.html www/index.html
            elif [ -f .zip-source/www/index.html ]; then
              cp .zip-source/www/index.html www/index.html
            else
              echo "ERROR: www/index.html missing from ZIP"
              exit 1
            fi
          else
            echo "ERROR: upload Tapas_Fiesta_Capacitor.zip or www/index.html"
            exit 1
          fi
          test -s www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync game
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tapas-fiesta-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
