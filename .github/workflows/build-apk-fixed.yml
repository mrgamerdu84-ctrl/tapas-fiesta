name: Build Tapas Fiesta APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare game
        shell: bash
        run: |
          set -e
          if [ -s www/index.html ]; then
            echo "Game source found"
          elif [ -f Tapas_Fiesta_Capacitor.zip ]; then
            mkdir -p .zip-source www
            unzip -q Tapas_Fiesta_Capacitor.zip -d .zip-source
            if [ -f .zip-source/tapas-capacitor/www/index.html ]; then
              cp .zip-source/tapas-capacitor/www/index.html www/index.html
            elif [ -f .zip-source/www/index.html ]; then
              cp .zip-source/www/index.html www/index.html
            else
              echo "ERROR: www/index.html missing from ZIP"
              exit 1
            fi
          else
            echo "ERROR: upload Tapas_Fiesta_Capacitor.zip or www/index.html"
            exit 1
          fi
          test -s www/index.html

      - name: Prepare Tapas Fiesta branding
        shell: bash
        run: |
          set -e
          mkdir -p resources
          if [ -f Tapas_Fiesta_Branding.zip ]; then
            rm -rf .branding-source
            mkdir -p .branding-source
            unzip -q Tapas_Fiesta_Branding.zip -d .branding-source
            if [ -f .branding-source/resources/icon.png ]; then
              cp .branding-source/resources/icon.png resources/icon.png
            fi
            if [ -f .branding-source/resources/splash.png ]; then
              cp .branding-source/resources/splash.png resources/splash.png
            fi
          fi

          if [ ! -s resources/icon.png ] || [ ! -s resources/splash.png ]; then
            echo "ERROR: Tapas Fiesta icon/splash missing. Upload Tapas_Fiesta_Branding.zip."
            exit 1
          fi

          cp resources/icon.png resources/icon-only.png
          cp resources/splash.png www/tapas-fiesta-splash.png

      - name: Add full-screen launch image to game shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="tfLaunchSplash"'
          if marker not in s:
              css = '''\n<style id="tf-launch-splash-style">\n#tfLaunchSplash{position:fixed;inset:0;z-index:2147483647;background:#F6EEDD url("tapas-fiesta-splash.png") center center/contain no-repeat;opacity:1;pointer-events:none;transition:opacity .35s ease;}\n#tfLaunchSplash.tf-hide{opacity:0;}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              launch = '''\n<div id="tfLaunchSplash" aria-hidden="true"></div>\n<script>\n(function(){\n  var done=false;\n  function hideTapasSplash(){\n    if(done) return; done=true;\n    var el=document.getElementById('tfLaunchSplash');\n    if(!el) return;\n    el.classList.add('tf-hide');\n    setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); },400);\n  }\n  window.addEventListener('load',function(){setTimeout(hideTapasSplash,1400);},{once:true});\n  setTimeout(hideTapasSplash,3500);\n})();\n</script>\n'''
              m = re.search(r'<body[^>]*>', s, flags=re.I)
              if not m:
                  raise SystemExit('ERROR: <body> not found in index.html')
              s = s[:m.end()] + launch + s[m.end():]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Apply approved Mexican fiesta design and wheel alignment fix
        run: python3 scripts/patch_tapas_ui.py

      - name: Verify stable gameplay core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('www/index.html').read_text(encoding='utf-8')
          required = {
              'ingredient gain': 'player.hand[seg.key]++;',
              'mystery ingredient': 'if(seg.key === "epice")',
              'mystery action': 'resolveCoupDePiment(atkIdx, defIdx',
              'AI turn': 'function runAiTurn()',
              'AI scheduling': 'setTimeout(runAiTurn, 800);',
              'AI after spin': 'setTimeout(aiTryCookThenEnd, 700);',
          }
          missing = [name for name, marker in required.items() if marker not in s]
          if missing:
              raise SystemExit('ERROR stable gameplay core missing: ' + ', '.join(missing))
          print('Stable gameplay core verified: ingredients + mystery + AI')
          PY

      - name: Apply V7 wheel sound variety and new recipes
        run: python3 scripts/patch_wheel_recipes_v7.py

      - name: Verify V7 and stable core together
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('www/index.html').read_text(encoding='utf-8')
          required = {
              'ingredient gain': 'player.hand[seg.key]++;',
              'mystery ingredient': 'if(seg.key === "epice")',
              'AI scheduling': 'setTimeout(runAiTurn, 800);',
              'wheel anti-repeat': 'function pickWheelIndex(state)',
              'wheel audio unlock': 'function unlockWheelAudio()',
              'pointer ratchet': 'tf-ratchet',
              'new recipe 1': 'Tacos Guacamole',
              'new recipe 2': 'Fajitas Fiesta',
              'new recipe 3': 'Quesadilla Mystère',
              'new recipe 4': 'Taco del Chef',
              'new recipe 5': 'Nachos Supremo',
              'new recipe 6': 'Fiesta del Fuego',
          }
          missing = [name for name, marker in required.items() if marker not in s]
          if missing:
              raise SystemExit('ERROR V7 validation failed: ' + ', '.join(missing))
          print('V7 verified: sound + varied wheel + 16 recipes + stable ingredients/mystery/AI')
          PY

      - name: Add copyright protection notice
        run: python3 scripts/add_copyright.py

      - name: Add privacy policy and contact
        run: python3 scripts/add_privacy.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate game JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('ERROR: no inline JavaScript found')
          Path('/tmp/tapas-game.js').write_text(max(scripts, key=len), encoding='utf-8')
          PY
          node --check /tmp/tapas-game.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android icon and splash resources
        shell: bash
        run: |
          npm install --no-save @capacitor/assets
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#F6EEDD' \
            --iconBackgroundColorDark '#F6EEDD' \
            --splashBackgroundColor '#F6EEDD' \
            --splashBackgroundColorDark '#F6EEDD'

      - name: Sync game
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tapas-fiesta-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
